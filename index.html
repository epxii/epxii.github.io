<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Epifanio Sarabia | Video, Web and Social</title>
<meta name="description" content="Epifanio Sarabia is an Austin-based web designer and digital marketer. Video, social, web design and SEO work.">
<meta property="og:title" content="Epifanio Sarabia | Video, Web and Social">
<meta property="og:description" content="Austin-based web designer and digital marketer. Video, social, web design and SEO work.">
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
:root{
  --bg:#FFFFFF; --red:#0000AA; --paper:#FFFFFF; --ink:#1A1A1A; --muted:#666666; --accent:#000000;
  --peach:#ECECEC; --peach-deep:#D4D4D4; --line:rgba(0,0,0,.09); --shadow:rgba(0,0,0,.13);
  --f-top:#F2F2F2; --f-bot:#E3E3E3; --b-top:#D5D5D5; --b-bot:#C6C6C6; --f-edge:rgba(255,255,255,.85);
  --doc:#1C1C1C; --doc-line:rgba(255,255,255,.28); --doc-edge:rgba(0,0,0,.2);
  --veil-a:rgba(255,255,255,.82); --veil-b:rgba(255,255,255,.6); --veil-c:rgba(255,255,255,.35);
  --scrim:rgba(255,255,255,.6); --hi:rgba(255,255,255,.7); --th-img:#F2F2F2; --th-dim:1; --logo-filter:none;
  color-scheme:light;
  --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --dot:var(--sans);
  --ease:cubic-bezier(.2,.8,.2,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --bg:#0C0C0C; --red:#0000AA; --paper:#171717; --ink:#F2F2F2; --muted:#8F8F8F; --accent:#FFFFFF;
  --peach:#2B2B2B; --peach-deep:#3C3C3C; --line:rgba(255,255,255,.1); --shadow:rgba(0,0,0,.6);
  --f-top:#3B3B3B; --f-bot:#2F2F2F; --b-top:#4A4A4A; --b-bot:#3C3C3C; --f-edge:rgba(255,255,255,.12);
  --doc:#F4F4F4; --doc-line:rgba(0,0,0,.16); --doc-edge:rgba(255,255,255,.3);
  --veil-a:rgba(12,12,12,.78); --veil-b:rgba(12,12,12,.55); --veil-c:rgba(12,12,12,.3);
  --scrim:rgba(12,12,12,.6); --hi:rgba(255,255,255,.08); --th-img:#222; --th-dim:.62; --logo-filter:invert(1);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;overflow:hidden;transition:background-color .6s,color .6s}
#intro,#win,.f-back,.f-back::before,.f-front,.doc,.toggle,.toggle button,.index td{transition:background-color .6s,color .6s,border-color .6s,box-shadow .6s}
#theme{position:fixed;z-index:35;top:calc(16px + env(safe-area-inset-top,0px));right:24px;width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;color:var(--ink);background:color-mix(in srgb,var(--ink) 6%,transparent);transition:background-color .3s,color .6s,transform .4s var(--ease)}
#theme:hover{background:color-mix(in srgb,var(--ink) 12%,transparent);transform:rotate(-20deg)}
#theme svg{width:18px;height:18px}
#theme .moon{display:none}
:root[data-theme="dark"] #theme .moon{display:block}
:root[data-theme="dark"] #theme .sun{display:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}

/* ---------- Intro ---------- */
#intro{position:fixed;inset:0;display:grid;place-items:center;z-index:30;background:#0C0C0C;
  transition:opacity .5s ease}
#intro.gone{opacity:0;pointer-events:none}
.stack{display:grid;justify-items:center;gap:14px;position:relative;z-index:2}
#reel{position:absolute;inset:0;overflow:hidden;z-index:0;filter:brightness(.68)}
body:has(#intro:not(.gone)) #theme{color:#F2F2F2;background:rgba(255,255,255,.1)}
#reel .loop{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s ease}
#reel .v-light{opacity:1}
.veil{position:absolute;inset:0;z-index:1;background:radial-gradient(ellipse at center,rgba(12,12,12,.62) 0%,rgba(12,12,12,.5) 45%,rgba(12,12,12,.3) 100%)}
.hello-wrap{display:grid}
.hello-wrap h1{grid-area:1/1;margin:0;font-family:"Arial Black","Archivo Black",Arial,sans-serif;font-weight:900;letter-spacing:-.01em;line-height:1;text-transform:uppercase;color:#EEFF00;
  font-size:clamp(30px,6.6vw,110px);text-align:center;transform-origin:50% 50%;will-change:transform,opacity;backface-visibility:hidden}
#enter{padding:30px 40px 10px;margin-top:-18px;border-radius:999px;cursor:pointer}
#enter:focus{outline:none}

.word{position:relative;display:inline-block;font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;font-size:clamp(22px,4.95vw,82px);font-weight:400;line-height:1;
  letter-spacing:.02em;text-transform:uppercase;color:#EEFF00;padding:8px 6px;animation:pulse 3s cubic-bezier(.45,0,.55,1) infinite;transition:opacity .3s,transform .3s var(--ease)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
#enter:hover .word,#enter:focus-visible .word{animation:none;opacity:1;transform:translateY(-2px)}
#enter:focus-visible .word{outline:1px solid #EEFF00;outline-offset:6px}
@media (prefers-reduced-motion:reduce){.word{animation:none}}
.word span{display:inline-block;transform-origin:50% 100%;will-change:transform;white-space:pre}

/* ---------- Menu bar ---------- */
#bar{position:fixed;top:0;left:0;right:0;z-index:10;display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;gap:16px;padding:calc(18px + env(safe-area-inset-top,0px)) 28px 18px;
  opacity:0;transform:translateY(-8px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
#bar.on{opacity:1;transform:none}
.me{justify-self:start;display:block;line-height:0;border-radius:50%;transition:transform .4s var(--ease)}
.me img{width:34px;height:34px;display:block}
.me:hover{transform:rotate(-12deg)}
nav{display:flex;gap:26px}
nav button{font-size:15px;color:var(--muted);transition:color .2s;white-space:nowrap;flex:none}
nav button:hover,nav button[aria-current="true"]{color:var(--ink)}
.right{justify-self:end;display:flex;align-items:center;gap:20px;padding-right:50px}
.toggle{display:flex;gap:2px;padding:3px;border-radius:999px;background:color-mix(in srgb,var(--ink) 6%,transparent)}
.toggle button{font-size:13px;padding:5px 12px;border-radius:999px;color:var(--muted)}
.toggle button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 4px var(--shadow)}
#clock{color:var(--ink);display:flex;align-items:center;line-height:0;white-space:nowrap}
#clock svg{height:15px;width:auto;display:block}
#clock .off{opacity:.1}

/* ---------- Desk ---------- */
#desk{position:fixed;inset:0;top:72px;opacity:0;transition:opacity .4s}
#desk.on{opacity:1}
#icons{position:absolute;inset:0}
.folder{position:absolute;translate:-50% -50%;opacity:0;transform:translateY(48px);display:grid;justify-items:center;gap:10px;
  width:150px;padding:8px;transition:transform .75s cubic-bezier(.2,.9,.25,1),opacity .55s ease-out}
.folder.in{transform:none;opacity:1}
.folder:focus-visible{outline:2px solid var(--f-bot);outline-offset:2px;border-radius:16px}
#tidy{position:absolute;left:28px;bottom:calc(22px + env(safe-area-inset-bottom,0px));font-size:13px;color:var(--muted)}
#tidy:hover{color:var(--ink)}
#desk.listmode #tidy{display:none}
@media (max-width:760px){#tidy{display:none}}
.folder.holding{transform:scale(.96);transition:transform .25s var(--ease)}
.folder.dragging{transform:scale(1.08);transition:transform .2s var(--ease);cursor:grabbing;z-index:50}
.folder.dragging .fx{filter:drop-shadow(0 18px 22px rgba(0,0,0,.22))}
.folder.dragging .peek .th,.folder.dragging .f-front{transform:none!important}
.folder.settle{transition:left .35s var(--ease),top .35s var(--ease),transform .35s var(--ease)}
.fx{position:relative;width:120px;height:92px;perspective:500px}
.f-back{position:absolute;inset:10px 0 0;border-radius:12px;background:linear-gradient(180deg,var(--b-top),var(--b-bot))}
.f-back::before{content:"";position:absolute;left:0;top:-10px;width:46px;height:16px;border-radius:8px 10px 0 0;background:var(--b-top)}
.f-front{position:absolute;left:0;right:0;bottom:0;height:72%;border-radius:12px;z-index:3;
  background:linear-gradient(180deg,color-mix(in srgb,var(--f-top) 86%,transparent),color-mix(in srgb,var(--f-bot) 90%,transparent));
  backdrop-filter:blur(8px) saturate(1.3);-webkit-backdrop-filter:blur(8px) saturate(1.3);
  box-shadow:inset 0 1px 0 var(--f-edge),inset 0 0 0 .5px rgba(255,255,255,.18),0 10px 22px -12px var(--shadow);
  transform-origin:50% 100%;transition:transform .45s var(--ease)}
.peek{position:absolute;inset:0;z-index:2}
.peek .th{position:absolute;left:50%;top:22px;width:68px;height:50px;margin-left:-34px;border-radius:7px;
  box-shadow:0 4px 10px -4px var(--shadow);transition:transform .5s var(--ease)}
.folder:hover .f-front,.folder:focus-visible .f-front{transform:rotateX(-24deg)}
.folder:hover .peek .th:nth-child(1),.folder:focus-visible .peek .th:nth-child(1){transform:translate(-42px,-46px) rotate(-14deg)}
.folder:hover .peek .th:nth-child(2),.folder:focus-visible .peek .th:nth-child(2){transform:translate(0,-60px)}
.folder:hover .peek .th:nth-child(3),.folder:focus-visible .peek .th:nth-child(3){transform:translate(42px,-46px) rotate(14deg)}
.fname{font-size:15px;letter-spacing:-.01em}
.fcount{font-family:var(--dot);font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);margin-top:-6px}
.folder:hover .fcount{color:var(--ink)}
/* text file icon */
.doc{width:74px;height:92px;margin:0 auto;border-radius:8px;background:var(--doc);position:relative;
  box-shadow:0 8px 20px -10px var(--shadow),inset 0 0 0 1px var(--doc-edge);transition:transform .45s var(--ease),background-color .6s}
.doc i{position:absolute;left:14px;right:14px;height:3px;border-radius:2px;background:var(--doc-line);transition:background-color .6s}
.doc i:nth-child(1){top:22px}.doc i:nth-child(2){top:32px}.doc i:nth-child(3){top:42px;right:28px}.doc i:nth-child(4){top:52px}
.folder:hover .doc{transform:translateY(-4px) rotate(-3deg)}

#replay{position:absolute;left:28px;bottom:calc(22px + env(safe-area-inset-bottom,0px));font-size:13px;color:var(--muted)}
#replay:hover{color:var(--ink)}

/* list view: the plain text index */
#list{position:absolute;inset:0;overflow:auto;padding:40px 28px 80px;display:none}
#desk.listmode #icons{display:none}
#desk.listmode #list{display:block}
.index{max-width:980px;margin:0 auto;border-collapse:collapse;width:100%}
.index th{font-weight:400;font-size:13px;color:var(--muted);text-align:left;padding:0 0 12px}
.index td{padding:14px 16px 14px 0;border-top:1px solid var(--line);vertical-align:baseline}
.index td:first-child{font-size:clamp(18px,2.2vw,24px);letter-spacing:-.02em}
.index td:not(:first-child){font-size:14px;color:var(--muted)}
.index td.yr{font-family:var(--dot);font-variant-numeric:tabular-nums;font-size:15px}
.index tr.row{cursor:pointer}
.index tr.row:hover td:first-child,.index tr.row:focus-visible td:first-child{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px}
.index tr.row:hover td{color:var(--ink)}
.index tr.row:focus-visible{outline:none}

/* ---------- Carousel flyers ---------- */
#flyer{position:fixed;inset:0;pointer-events:none;z-index:20}
.fly{position:absolute;left:0;top:0;border-radius:14px;overflow:hidden;box-shadow:0 14px 30px -14px var(--shadow)}

/* ---------- Thumbnails (placeholder art) ---------- */
.th{background:linear-gradient(140deg,hsl(0 0% calc(84% + var(--h) * .03%)),hsl(0 0% calc(68% + var(--h) * .03%)));position:relative;overflow:hidden}
.th .play{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;background:rgba(255,255,255,.7)}
.th .play::after{content:"";position:absolute;left:40%;top:30%;border-left:12px solid #2a2a2a;border-top:8px solid transparent;border-bottom:8px solid transparent;scale:var(--s,1)}
.th .dur{position:absolute;right:8%;bottom:8%;font-family:var(--dot);font-variant-numeric:tabular-nums;font-size:11px;color:#fff}
.th .posts{position:absolute;inset:18% 12%;display:grid;grid-template-columns:repeat(3,1fr);gap:6%}
.th .posts i{border-radius:4px;background:rgba(255,255,255,.65);aspect-ratio:1;align-self:center}
.th .phone{position:absolute;left:50%;top:14%;bottom:-6%;width:30%;translate:-50% 0;border-radius:10px 10px 0 0;background:rgba(255,255,255,.75);padding:8% 7%;display:grid;gap:6%;align-content:start}
.th .phone i{height:10px;border-radius:3px;background:#D9D9D9}
.th .page{position:absolute;inset:16% 16% 0;border-radius:6px 6px 0 0;background:rgba(255,255,255,.75);padding:8%;display:grid;gap:7%;align-content:start}
.th .page b{height:14px;border-radius:3px;background:#9A9A9A;width:60%}
.th .page i{height:5px;border-radius:2px;background:#E4E4E4}
.th .glyph{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(22px,40%,64px);font-weight:700;letter-spacing:-.06em;color:rgba(255,255,255,.85)}
.th .glyph{font-size:2.4em}
.th{filter:brightness(var(--th-dim))}
.th-img{filter:none;background:var(--th-img);display:grid;place-items:center}
.th-img img{width:46%;height:auto}
.card .go{display:inline-block;margin-top:10px;font-size:14px;color:var(--ink);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.card .go:hover{color:var(--accent)}
.th-img img,.me img{filter:var(--logo-filter)}

/* ---------- Window ---------- */
#scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .4s}
#scrim.on{opacity:1;pointer-events:auto}
#win{position:fixed;left:50%;top:50%;translate:-50% -50%;z-index:50;width:min(980px,92vw);max-height:min(82vh,820px);
  background:var(--paper);border-radius:28px;box-shadow:0 40px 90px -30px var(--shadow),0 0 0 1px var(--line);
  display:flex;flex-direction:column;overflow:hidden}
#win[hidden]{display:none}
.whead{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:30px 34px 18px}
.whead h2{margin:0;font-weight:400;font-size:clamp(30px,4vw,44px);letter-spacing:-.03em}
.whead .n{font-family:var(--dot);font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);margin-left:12px}
#close{font-size:14px;color:var(--muted)}
#close:hover{color:var(--ink)}
.wbody{overflow:auto;padding:4px 34px 36px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:30px 24px}
.card .th{aspect-ratio:4/3;border-radius:16px}
.card h3{margin:14px 0 4px;font-weight:500;font-size:17px;letter-spacing:-.015em}
.card p{margin:0 0 8px;font-size:14px;line-height:1.5;color:var(--muted);max-width:42ch}
.card .meta{font-size:13px;color:var(--muted);display:flex;gap:14px}
.card .meta span:first-child{color:var(--ink)}
.about{max-width:56ch;font-size:18px;line-height:1.55}
.about p{margin:0 0 1em}
.about a{color:var(--accent)}
.note{font-size:13px;color:var(--muted);margin-top:28px}

/* ---------- Mobile ---------- */
@media (max-width:760px){
  #bar{grid-template-columns:1fr auto;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 12px;row-gap:12px}
  nav{grid-column:1/-1;grid-row:2;overflow-x:auto;gap:20px;scrollbar-width:none}
  .right{gap:12px}
  .right{padding-right:44px}
  #clock svg{height:11px}
  .toggle button{padding:5px 10px}
  .me img{width:30px;height:30px}
  #theme{width:34px;height:34px;right:16px;top:calc(14px + env(safe-area-inset-top,0px))}
  .hello-wrap h1{font-size:8.6vw}
  .word{font-size:6.45vw}
  nav{-webkit-overflow-scrolling:touch;padding-bottom:2px}
  #desk{top:108px}
  #icons{display:grid;grid-template-columns:1fr 1fr;align-content:start;gap:28px 8px;padding:24px 12px 90px;overflow:auto}
  .folder{position:static;translate:none;rotate:none!important;width:auto}
  #list{padding:24px 18px 80px}
  .index th:nth-child(3),.index td:nth-child(3){display:none}
  .whead{padding:24px 22px 14px}.wbody{padding:4px 22px 28px}
  #win{width:94vw;max-height:84vh;border-radius:22px}
  #replay{left:18px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
}


/* ---------- Intro: logo only ---------- */
#intro{transition:opacity .7s ease}
#enter{padding:24px;margin:0;border-radius:50%;cursor:pointer;background:none}
#enter .mark{display:block;width:clamp(96px,11vw,150px);height:auto;filter:invert(1) drop-shadow(0 8px 24px rgba(0,0,0,.35));
  transition:transform .6s cubic-bezier(.3,.7,.3,1)}
#enter:hover .mark,#enter:focus-visible .mark{animation:floaty 2.6s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
#enter:focus-visible{outline:1px solid rgba(255,255,255,.5);outline-offset:4px}
@media (prefers-reduced-motion:reduce){#enter:hover .mark{animation:none}}

/* ---------- Header: centered, never colliding ---------- */
#bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;
  padding:calc(16px + env(safe-area-inset-top,0px)) clamp(16px,2.4vw,28px) 14px}
#bar .me{order:1;flex:1 1 0;display:flex;justify-content:flex-start}
#bar nav{order:2;flex:0 1 auto;min-width:0;display:flex;gap:clamp(16px,2vw,26px);overflow-x:auto;scrollbar-width:none}
#bar nav::-webkit-scrollbar{display:none}
#bar nav>:first-child{margin-left:auto}#bar nav>:last-child{margin-right:auto}
#bar .right{order:3;flex:1 1 0;display:flex;justify-content:flex-end;align-items:center;gap:14px;padding-right:0}
#bar #theme{position:static;flex:none;width:36px;height:36px}
#desk{top:var(--barh,72px)}
@media (max-width:1080px){
  #bar{justify-content:space-between}
  #bar .me,#bar .right{flex:0 0 auto}
  #bar nav{order:4;flex:1 1 100%;max-width:100%;justify-content:space-between}
  #bar nav>:first-child,#bar nav>:last-child{margin:0}
}
@media (max-width:540px){
  #bar nav{gap:clamp(9px,2.8vw,18px)}
  #bar nav button{font-size:clamp(12.5px,3.55vw,15px)}
}
@media (max-width:420px){
  #bar{gap:10px 12px}
  #bar .right{gap:10px}
  .toggle button{padding:5px 9px}
  #clock svg{height:10px}
}

/* ---------- Header v3: one line ---------- */
#bar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;column-gap:clamp(14px,2vw,28px)}
#bar .me{grid-column:1;grid-row:1;justify-self:start}
#bar nav{grid-column:2;grid-row:1;justify-content:center;gap:clamp(14px,1.9vw,28px)}
#bar nav>*{margin:0!important}
#bar nav button{font-size:clamp(13.5px,1.25vw,15px)}
#bar .right{grid-column:3;grid-row:1;justify-self:end;gap:12px}
.toggle button{display:grid;place-items:center;width:32px;height:26px;padding:0!important}
#bar #theme{width:32px;height:32px}
#clock svg{height:13px}
@media (max-width:780px){
  #bar{grid-template-columns:auto 1fr}
  #bar nav{display:none}
  #bar .right{grid-column:2}
}

/* ---------- Real media ---------- */
.th-photo{filter:none;background:var(--th-img)}
.th-photo img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.acts{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px}
.acts .go{margin:0;font-size:14px;color:var(--ink);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;background:none;padding:0;cursor:pointer}
.acts .links{display:flex;flex-wrap:wrap;gap:6px 14px;width:100%}
.about{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:28px;max-width:none;align-items:start}
.about .me-photo{width:100%;border-radius:16px;display:block}
.about .contact{display:flex;gap:20px;flex-wrap:wrap}
.about .resumes{margin-top:-6px;gap:8px 20px}.about .resumes span{color:var(--muted)}
@media (max-width:640px){.about{grid-template-columns:1fr}.about .me-photo{max-width:180px}}

(function enableDrag(){

  let z=10, st=null, swallow=false;

  icons.addEventListener('pointerdown',e=>{
    const f=e.target.closest('.folder'); if(!f||narrow()||e.button>0)return;
    const r=f.getBoundingClientRect();
    st={f,id:e.pointerId,sx:e.clientX,sy:e.clientY,ox:e.clientX-(r.left+r.width/2),oy:e.clientY-(r.top+r.height/2),drag:false};
  });
  addEventListener('pointermove',e=>{
    if(!st||e.pointerId!==st.id)return;
    if(!st.drag){
      if(Math.hypot(e.clientX-st.sx,e.clientY-st.sy)<4)return;
      st.drag=true;st.f.classList.add('dragging');st.f.style.zIndex=++z;try{st.f.setPointerCapture(st.id)}catch(_){}
    }
    e.preventDefault();
    const box=icons.getBoundingClientRect();
    const x=Math.min(96,Math.max(4,(e.clientX-st.ox-box.left)/box.width*100));
    const y=Math.min(94,Math.max(6,(e.clientY-st.oy-box.top)/box.height*100));
    st.f.style.left=x+'%';st.f.style.top=y+'%';
  });
  const end=e=>{
    if(!st||(e&&e.pointerId!==st.id))return;
    clearTimeout(st.timer);const f=st.f;f.classList.remove('holding');
    if(st.drag){swallow=true;f.classList.remove('dragging');f.classList.add('settle');setTimeout(()=>f.classList.remove('settle'),400);

      store.set('epi-pos-v3',JSON.stringify(pos))}
    st=null;
  };
  addEventListener('pointerup',end);addEventListener('pointercancel',end);
  icons.addEventListener('click',e=>{if(swallow){swallow=false;e.stopPropagation();e.preventDefault()}},true);
  icons.addEventListener('dragstart',e=>e.preventDefault());

/* The carousel moment: work floats in, then sorts itself into folders */
function runCarousel(){
  const layer=$('#flyer'), vw=innerWidth, vh=innerHeight;
  const all=CATS.flatMap(c=>c.items.map(p=>({...p,cat:c.id})));
  const w=vw<760?112:168, h=Math.round(w*.72), gap=vw<760?12:20;
  const rowW=all.length*(w+gap)-gap, start=(vw-rowW)/2;
  const cards=all.map((p,i)=>{
    const el=document.createElement('div');el.className='fly';el.style.width=w+'px';el.style.height=h+'px';
    el.innerHTML=thumb(p);el.firstChild.style.height='100%';layer.appendChild(el);
    const x1=start+i*(w+gap), y=vh*.5-h/2+Math.sin(i*1.7)*vh*.07, x0=x1+vw*1.1;
    el.animate([{transform:`translate(${x0}px,${y}px)`},{transform:`translate(${x1-80}px,${y}px)`}],
      {duration:1500,easing:'cubic-bezier(.2,.65,.35,1)',fill:'forwards'});
    // gentle float while it hangs in the air
    return {el,x1,y,p};
  });
  setTimeout(()=>{
    cards.forEach((c,i)=>{
      const r=folderEl(c.p.cat).querySelector('.f-back').getBoundingClientRect();
      const tx=r.left+r.width/2-w/2, ty=r.top+r.height/2-h/2;
      const now=getComputedStyle(c.el).transform;
      c.el.getAnimations().forEach(a=>a.cancel());
      c.el.animate([{transform:now,opacity:1},
        {transform:`translate(${tx}px,${ty}px) scale(.25)`,opacity:0}],
        {duration:650,delay:i*20,easing:'cubic-bezier(.55,0,.3,1)',fill:'both'});
    });
    [...CATS.map(c=>c.id),'about'].forEach((id,j)=>setTimeout(()=>folderEl(id).classList.add('in'),300+j*90));
    setTimeout(()=>layer.innerHTML='',650+all.length*20+60);
  },1150);
}

  // the corner logo spins and zooms back to the center of the screen
  mark.style.opacity='0'; homeImg().style.visibility='hidden';
  requestAnimationFrame(()=>{
    flyLogo(from,mark.getBoundingClientRect(),fromF,MARK_F,-1080).then(()=>{mark.style.opacity='';homeImg().style.visibility=''});
  });
  armIntro();
}
/* Logo: inside a folder it takes you home; on the home desktop it replays the intro */
$('#home').onclick=()=>{
  const inside=!win.hidden || !$('#viewer').hidden;
  if(inside){closeViewer();closeWin();return}
  replayIntro();
};

/* Window */
const win=$('#win'), scrim=$('#scrim');
let origin=null;
function rectCenter(el){const r=el.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2]}
function openCat(id,from,focusTitle){
  track('open-'+id, 'Opened '+id);
  const c=id==='about'?ABOUT:CATS.find(x=>x.id===id);
  $('#wtitle').textContent=c.name;
  if(id==='about'){
    $('#wcount').textContent='';
    $('#wbody').innerHTML=`<div class="about"><img class="me-photo" src="${IMG.photo}" alt="Epifanio Sarabia">
      <div><p class="hi">Hi, I’m Epi.</p>
      <p>The first time I opened Windows Movie Maker on my mom’s laptop, I knew I loved making videos. Four years into doing it both professionally and as a passion project, my work runs across web design, social media and digital marketing, with video at the center of most of it.</p>
      <p>What I like most is taking an idea that only exists in my head or someone else’s and making it real.</p>
      <dl class="facts">
        <dt>What I do</dt><dd>Video editing and motion graphics, web design, social strategy, SEO and paid ads</dd>
        <dt>Tools</dt><dd>Premiere Pro, Photoshop, Illustrator, Figma, WordPress, Canva, CapCut, HTML and CSS</dd>
        <dt>Education</dt><dd>B.S. in Digital Media Innovation, Texas State University, 2024</dd>
        <dt>Off the clock</dt><dd>Live music, going to the movies, hiking, and customizing anything I can get my hands on, from old Apple hardware to the apps I use every day</dd>
        <dt>Languages</dt><dd>English and Spanish</dd>
        <dt>Based in</dt><dd>Austin, TX</dd>
      </dl>
      ${nowPlaying()}
      <p class="contact"><a href="mailto:epsab02@gmail.com">epsab02@gmail.com</a><a href="https://www.linkedin.com/in/epifanio-sarabia-32b2181a9/" target="_blank" rel="noopener">LinkedIn</a></p>
      <p class="contact"> <a class="hello" href="mailto:epsab02@gmail.com?subject=Hi%20Epi%2C%20I%20saw%20your%20portfolio" data-track="contact-about" aria-label="Get in touch by email"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg><span>Get in touch</span></a></p>
      <p class="contact resumes"><span>Résumé:</span><a href="Epifanio-Sarabia-Resume-Social.pdf" target="_blank" rel="noopener" download>Social and content</a><a href="Epifanio-Sarabia-Resume-Web.pdf" target="_blank" rel="noopener" download>Web and design</a></p></div></div>`;
  } else {
    $('#wcount').textContent=c.items.length+' items';
    $('#wbody').innerHTML=`<div class="grid">${c.items.map(p=>`<article class="card">${p.scroll?`<div class="th scroll-th"><div class="ba-scroll"><img src="${p.scroll}" alt="${p.t} page" loading="lazy"></div><span class="ba-tag l">Scroll</span></div>`:p.ba?baInline(p):p.slides?carousel(p):p.preview?`<div class="th th-photo${p.vertical?' vert':''}"><video src="${p.preview}" poster="${p.img}" autoplay muted loop playsinline preload="metadata"></video></div>`:thumb(p)}<h3>${p.t}</h3><p>${p.d}</p><div class="meta"><span>${p.org}</span><span>${p.role}</span></div>${cardActions(p,c.id)}</article>`).join('')}</div>`;
  }
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.cat===id));
  const wasOpen=!win.hidden; win.hidden=false; scrim.classList.add('on'); origin=from;
  if(!wasOpen && !reduce && from){
    const [ox,oy]=rectCenter(from),[wx,wy]=rectCenter(win);
    win.animate([{transform:`translate(${ox-wx}px,${oy-wy}px) scale(.1)`,opacity:0},{transform:'none',opacity:1}],
      {duration:560,easing:'cubic-bezier(.2,.85,.2,1)'});
  }
  { // window title and count in the LED dot-matrix
    const t=$('#wtitle'), n=$('#wcount'), name=t.textContent, cnt=n.textContent;
    t.setAttribute('aria-label',name); t.innerHTML=ledSVG(name.toUpperCase());
    n.innerHTML=cnt?ledSVG(cnt.toUpperCase()):''; n.setAttribute('aria-hidden','true');
  }
  $('#wbody').scrollTop=0; $('#close').focus();
  if(focusTitle){const card=[...document.querySelectorAll('#wbody .card')].find(c=>c.querySelector('h3')?.textContent===focusTitle);
    if(card){setTimeout(()=>{card.scrollIntoView({block:'center',behavior:reduce?'auto':'smooth'});card.classList.add('flash');setTimeout(()=>card.classList.remove('flash'),1600)},reduce?0:450)}}
}
function closeWin(instant){
  if(win.hidden)return;
  scrim.classList.remove('on');
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current','false'));
  const done=()=>{win.hidden=true; if(origin&&origin.focus&&!instant)origin.focus()};
  if(reduce||instant||!origin){done();return}
  const [ox,oy]=rectCenter(origin),[wx,wy]=rectCenter(win);
  win.animate([{transform:'none',opacity:1},{transform:`translate(${ox-wx}px,${oy-wy}px) scale(.1)`,opacity:0}],
    {duration:380,easing:'cubic-bezier(.6,0,.4,1)'}).onfinish=done;
}
$('#close').onclick=()=>closeWin();scrim.onclick=()=>closeWin();
addEventListener('keydown',e=>{if(e.key==='Escape'){if(!closeViewer())closeWin()}});
$('#vclose').onclick=closeViewer;

/* Theme: dark from 7 PM to 7 AM unless the visitor picks one */
function autoTheme(){const h=new Date().getHours();return (h>=19||h<7)?'dark':'light'}
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  $('#theme').setAttribute('aria-label',t==='dark'?'Switch to light mode':'Switch to dark mode');
}
applyTheme(store.get('epi-theme')||autoTheme());
$('#theme').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';store.set('epi-theme',t);applyTheme(t)};
setInterval(()=>{if(!store.get('epi-theme'))applyTheme(autoTheme())},60000);

/* Header height drives where the desktop starts */
function syncBar(){document.documentElement.style.setProperty('--barh',$('#bar').offsetHeight+'px')}
addEventListener('resize',()=>{syncBar();tick()});syncBar();setTimeout(syncBar,300);

/* Ambient loop runs only while the desktop is showing and the tab is visible */
const amb=$('#ambient'); // pre-slowed, frame-blended, seamless loop: plays at normal speed
function ambOn(){if(reduce)return;amb.classList.add('on');amb.play().catch(()=>{})}
function ambOff(){amb.classList.remove('on');amb.pause()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)amb.pause();else if(amb.classList.contains('on'))amb.play().catch(()=>{})});

/* List view: grouped by folder, scannable rows */
function buildList(){
  const lv=$('#lv');
  lv.innerHTML=CATS.map(c=>`<section class="lv-sec">
    <h2 class="lv-h"><span>${c.name}</span><em>${c.items.length}</em></h2>
    ${c.items.map(p=>`<button class="lv-row" data-cat="${c.id}" data-title="${p.t.replace(/"/g,'&quot;')}">
      <span class="lv-th">${p.img?`<img src="${p.img}" alt="" loading="lazy">`:thumb(p)}</span>
      <span class="lv-main"><b>${p.t}</b><small>${p.org}</small></span>
      <span class="lv-role">${p.role}</span>
      <span class="lv-go" aria-hidden="true">→</span></button>`).join('')}
  </section>`).join('')+`<section class="lv-sec"><h2 class="lv-h"><span>About</span></h2>
    <button class="lv-row" data-cat="about"><span class="lv-th lv-doc"><img src="${IMG.photo}" alt=""></span><span class="lv-main"><b>About me</b><small>Bio, skills and résumés</small></span><span class="lv-role"></span><span class="lv-go" aria-hidden="true">→</span></button></section>`;
  lv.querySelectorAll('.lv-row').forEach(r=>r.onclick=()=>openCat(r.dataset.cat,r,r.dataset.title));
}
buildList();

/* Folder labels in the same LED dot-matrix as the clock */
folderEl('about').setAttribute('aria-label','Open About me');
document.querySelectorAll('.folder .fname,.folder .fcount').forEach(el=>{const t=el.textContent.trim();el.setAttribute('aria-hidden','true');el.innerHTML=ledSVG(t.toUpperCase())});

/* Intro ends when the video finishes, not on a fixed timer */
const introVid=document.querySelector('#reel video');
if(introVid){introVid.loop=false;introVid.addEventListener('ended',()=>{if(!entered)playExit()})}
function armIntro(){
  clearTimeout(autoT);
  // safety net in case the video can't autoplay or stalls
  autoT=setTimeout(()=>{if(!entered)playExit()},(introVid&&!reduce)?9000:4000);
}

/* GoatCounter events: folder opens, resume downloads, contact clicks */
function track(name,title){try{if(window.goatcounter&&goatcounter.count)goatcounter.count({path:name,title:title||name,event:true})}catch(_){}}
document.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;
  if(a.dataset.track)return track(a.dataset.track,'Get in touch');
  const h=a.getAttribute('href')||'';
  if(h.endsWith('Resume-Social.pdf'))track('resume-social','Downloaded Social résumé');
  else if(h.endsWith('Resume-Web.pdf'))track('resume-web','Downloaded Web résumé');
  else if(h.startsWith('mailto:'))track('email','Clicked email');
  else if(/linkedin\.com/.test(h))track('linkedin','Clicked LinkedIn');
});

/* Start */
if(store.get('epi-view')==='list') setView('list');
if(store.get('epi-intro')){ entered=true; $('#intro').classList.add('gone'); showDesk(false); window.pauseLoop&&pauseLoop(); }
else { armIntro(); }
</script>
</body>
</html>
